<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Lock Ultimate - Web 3D (Fixed)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background: #111; color: white; overflow: hidden; width: 100vw; height: 100vh; }
    
    #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* LOGIN & LOBBY */
    #login-screen { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; }
    .login-box { background: #222; padding: 40px; border-radius: 15px; border: 2px solid #00aaff; width: 400px; text-align: center; }
    .login-box input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    .login-box button { width: 100%; padding: 10px; background: #00aaff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    
    #lobby-screen { position: absolute; inset: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 10; display: none; flex-direction: column; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 15px; border: 2px solid #00aaff; }
    .main-menu { display: flex; gap: 20px; margin-top: 30px; height: 100%; }
    .menu-sidebar { width: 250px; display: flex; flex-direction: column; gap: 10px; }
    .menu-btn { background: rgba(0, 170, 255, 0.2); border: 2px solid #00aaff; color: white; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .content-area { flex: 1; background: rgba(0,0,0,0.4); border-radius: 15px; padding: 20px; display: none; }
    .content-area.active { display: block; }
    
    .btn-play { background: linear-gradient(90deg, #ff416c, #ff4b2b); color: white; font-size: 24px; padding: 20px; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px; }
    .mode-selection { display: none; gap: 20px; }
    .mode-card { flex: 1; background: #222; border: 2px solid #555; padding: 20px; border-radius: 10px; cursor: pointer; text-align: center; }
    .mode-card:hover { border-color: #00aaff; }

    /* HUD GAME */
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; }
    .hud-top { display: flex; justify-content: center; padding-top: 20px; gap: 20px; }
    .scoreboard { background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 10px; font-size: 28px; font-weight: bold; border: 2px solid #ffaa00; }
    .player-stats { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; width: 200px; }
    .bar-container { background: #333; height: 15px; border-radius: 5px; margin-bottom: 10px; }
    .hp-bar { height: 100%; background: #ff3333; width: 100%; }
    
    /* THẺ PHẠT */
    #card-warning {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9); padding: 40px 80px; border-radius: 20px;
      border: 4px solid #fff; z-index: 999; display: none; text-align: center;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.5); pointer-events: none;
    }
    #card-warning h1 { font-size: 60px; margin-bottom: 10px; text-transform: uppercase; }
    #card-warning p { font-size: 24px; font-weight: bold; }
    .yellow-card h1 { color: #ffcc00; }
    .red-card h1 { color: #ff0000; text-shadow: 0 0 20px #ff0000; }

    #test-controls { position: absolute; bottom: 20px; right: 20px; z-index: 10; display: none; gap: 10px; }
    #test-controls button { background: #ffaa00; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h2>ĐĂNG NHẬP BLUE LOCK</h2>
      <input type="text" id="login-user" placeholder="Tên đăng nhập">
      <input type="password" id="login-pass" placeholder="Mật khẩu">
      <button onclick="login()">VÀO GAME</button>
    </div>
  </div>

  <div id="lobby-screen">
    <div class="header">
      <h2>BLUE LOCK ULTIMATE</h2>
      <div id="user-info">Player: <span id="lobby-name">Khách</span></div>
    </div>
    <div class="main-menu">
      <div class="menu-sidebar">
        <button class="menu-btn" onclick="showTab('home')">🏠 TRANG CHỦ</button>
      </div>
      <div class="content-area active" id="tab-home" style="display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <button class="btn-play" onclick="toggleModes()">VÀO TRẬN ⚽</button>
        <div class="mode-selection" id="mode-selection">
          <div class="mode-card" onclick="startGame()"><h3>ĐÁ TRẬN (CÓ TRỌNG TÀI)</h3><p>Sân to 100x140</p></div>
        </div>
      </div>
    </div>
  </div>

  <div id="game-container"></div>
  
  <div id="hud">
    <div class="hud-top">
      <div class="scoreboard"><span id="hud-score">🔵 0 - 0 🔴</span></div>
    </div>
    <div class="player-stats">
      <div style="font-weight:bold; margin-bottom:5px;" id="hud-player-name">PlayerName</div>
      <div style="font-size:12px; margin-bottom:2px;">Thể lực (HP)</div>
      <div class="bar-container"><div class="hp-bar" id="hud-hp"></div></div>
    </div>
    
    <div id="card-warning">
      <h1 id="card-type">THẺ VÀNG</h1>
      <p id="card-reason">Lỗi: Phạm lỗi thô bạo!</p>
    </div>

    <div id="test-controls">
      <button onclick="triggerFoul('yellow')">Test Thẻ Vàng</button>
      <button onclick="triggerFoul('red')">Test Thẻ Đỏ</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  
  <script type="module">
    import * as THREE from 'three';

    // ==========================================
    // 1. QUẢN LÝ DỮ LIỆU & UI CƠ BẢN
    // ==========================================
    let playerData = { username: "Khách" };

    window.login = function() {
      const user = document.getElementById('login-user').value.trim();
      if (!user) return alert("Nhập tên đi bạn!");
      
      playerData.username = user;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('lobby-screen').style.display = 'flex';
      document.getElementById('lobby-name').textContent = playerData.username;
    };

    window.showTab = function(tab) {};
    window.toggleModes = function() {
      const m = document.getElementById('mode-selection');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    };

    // ==========================================
    // 2. KHỞI TẠO GAME 3D
    // ==========================================
    let scene, camera, renderer;
    let player, ball, referee;
    let leftLeg, rightLeg, leftArm, rightArm;
    let refLeftLeg, refRightLeg, refLeftArm, refRightArm; // Chân tay trọng tài
    let keys = {};
    let isPlaying = false;
    let lastTime = 0;
    
    const ballPhysics = { velocity: new THREE.Vector3(), radius: 0.4, isControlled: false, gravity: -20 };
    const playerState = { velocityY: 0, isJumping: false };
    // Chiều cao nhân vật (để không bị lọt đất)
    const PLAYER_HEIGHT_OFFSET = 1.8; 

    window.startGame = function() {
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('test-controls').style.display = 'flex';
      
      document.getElementById('hud-player-name').textContent = playerData.username + " [Tiền Đạo]";
      
      isPlaying = true;
      init3D();
      animate();
    };

    function init3D() {
      if (renderer) return;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 50, 200);
      
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      // Giảm chất lượng shadow để tránh lỗi WebGL Context Lost
      renderer.shadowMap.type = THREE.BasicShadowMap; 
      document.getElementById('game-container').appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const sun = new THREE.DirectionalLight(0xffffff, 1);
      sun.position.set(50, 100, 50); 
      sun.castShadow = true; 
      sun.shadow.mapSize.width = 1024; // Giảm độ phân giải shadow
      sun.shadow.mapSize.height = 1024;
      scene.add(sun);

      // SÂN BÓNG TO HƠN (100x140)
      const grass = new THREE.Mesh(new THREE.PlaneGeometry(100, 140), new THREE.MeshStandardMaterial({ color: 0x2d8a2d }));
      grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);

      // Vạch kẻ sân
      function addLine(x, z, w, l) {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(w, l), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        line.rotation.x = -Math.PI / 2; line.position.set(x, 0.01, z); scene.add(line);
      }
      addLine(0, 0, 100, 0.4); // Giữa sân
      addLine(-50, 0, 0.4, 140); addLine(50, 0, 0.4, 140); // Biên dọc
      addLine(0, -70, 100, 0.4); addLine(0, 70, 100, 0.4); // Biên ngang
      
      // Vòng tròn giữa sân
      const circleGeo = new THREE.RingGeometry(10, 10.5, 64);
      const circleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
      const circle = new THREE.Mesh(circleGeo, circleMat);
      circle.rotation.x = -Math.PI / 2; circle.position.y = 0.02; scene.add(circle);

      // Khung thành
      function createGoal(zPos) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), mat); p1.position.set(-10, 3, 0); group.add(p1);
        const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), mat); p2.position.set(10, 3, 0); group.add(p2);
        const p3 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 20), mat); p3.rotation.z = Math.PI/2; p3.position.set(0, 6, 0); group.add(p3);
        group.position.z = zPos; return group;
      }
      scene.add(createGoal(-70)); scene.add(createGoal(70));

      // HÀM TẠO CẦU THỦ / TRỌNG TÀI (Minecraft Style)
      function buildCharacter(color, isRef) {
        const pGroup = new THREE.Group();
        const skinMat = new THREE.MeshStandardMaterial({ color: isRef ? 0x333333 : 0xffdbac }); 
        const bodyMat = new THREE.MeshStandardMaterial({ color: isRef ? 0x111111 : color }); 
        const limbMat = new THREE.MeshStandardMaterial({ color: isRef ? 0x111111 : 0x1a5c1a });

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat); head.position.y = 2.4; head.castShadow = true; pGroup.add(head);
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.5), bodyMat); body.position.y = 1.4; body.castShadow = true; pGroup.add(body);
        
        // Chân
        const lLeg = new THREE.Group(); lLeg.add(new THREE.Mesh(new THREE.BoxGeometry(0.35, 1, 0.35), limbMat)); lLeg.children[0].position.y = -0.5; lLeg.position.set(-0.25, 0.8, 0); pGroup.add(lLeg);
        const rLeg = new THREE.Group(); rLeg.add(new THREE.Mesh(new THREE.BoxGeometry(0.35, 1, 0.35), limbMat)); rLeg.children[0].position.y = -0.5; rLeg.position.set(0.25, 0.8, 0); pGroup.add(rLeg);
        
        // Tay
        const lArm = new THREE.Group(); lArm.add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), bodyMat)); lArm.children[0].position.y = -0.5; lArm.position.set(-0.575, 2, 0); pGroup.add(lArm);
        const rArm = new THREE.Group(); rArm.add(new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), bodyMat)); rArm.children[0].position.y = -0.5; rArm.position.set(0.575, 2, 0); pGroup.add(rArm);

        return { group: pGroup, lLeg, rLeg, lArm, rArm };
      }

      // Tạo Cầu thủ
      const pChar = buildCharacter(0x0066ff, false);
      player = pChar.group; 
      // SỬA LỖI LỌT ĐẤT: Nâng nhân vật lên một khoảng
      player.position.set(0, PLAYER_HEIGHT_OFFSET, 20); 
      scene.add(player);
      leftLeg = pChar.lLeg; rightLeg = pChar.rLeg; leftArm = pChar.lArm; rightArm = pChar.rArm;

      // Tạo TRỌNG TÀI AI
      const rChar = buildCharacter(0, true);
      referee = rChar.group; 
      referee.position.set(0, PLAYER_HEIGHT_OFFSET, 0); 
      scene.add(referee);
      refLeftLeg = rChar.lLeg; refRightLeg = rChar.rLeg; refLeftArm = rChar.lArm; refRightArm = rChar.rArm;
      
      // Bảng tên Trọng tài
      const refCanvas = document.createElement('canvas');
      refCanvas.width = 256; refCanvas.height = 64;
      const rctx = refCanvas.getContext('2d');
      rctx.fillStyle = 'rgba(0,0,0,0.5)'; rctx.fillRect(0,0,256,64);
      rctx.fillStyle = '#ffcc00'; rctx.font = 'bold 24px Arial'; rctx.textAlign = 'center'; rctx.fillText("TRỌNG TÀI", 128, 40);
      const refSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(refCanvas) }));
      refSprite.scale.set(4, 1, 1); refSprite.position.y = 3.5;
      referee.add(refSprite);

      // Bảng tên Người chơi
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 256; pCanvas.height = 64;
      const ctx = pCanvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,256,64);
      ctx.fillStyle = 'white'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.fillText(playerData.username, 128, 40);
      const pSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(pCanvas) }));
      pSprite.scale.set(4, 1, 1); pSprite.position.y = 3.5;
      player.add(pSprite);

      // Bóng
      ball = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      ball.castShadow = true; ball.position.set(0, 0.4, 0); scene.add(ball);

      document.addEventListener('keydown', e => keys[e.code] = true);
      document.addEventListener('keyup', e => keys[e.code] = false);

      lastTime = performance.now();
    }

    // ==========================================
    // 3. VÒNG LẶP GAME
    // ==========================================
    function animate() {
      if (!isPlaying) return;
      requestAnimationFrame(animate);
      
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePlayer(dt, now);
      updateReferee(dt, now);
      updateBall(dt);
      updateCamera();

      renderer.render(scene, camera);
    }

    function updatePlayer(dt, now) {
      const speed = 15; // Tăng tốc chạy cho kịp sân to
      const dir = new THREE.Vector3();
      if (keys['KeyW']) dir.z -= 1; if (keys['KeyS']) dir.z += 1; if (keys['KeyA']) dir.x -= 1; if (keys['KeyD']) dir.x += 1;
      
      const isMoving = dir.length() > 0;
      if (isMoving) {
        dir.normalize();
        player.position.x += dir.x * speed * dt;
        player.position.z += dir.z * speed * dt;
        player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.atan2(dir.x, dir.z), 0.2);
        
        // Animation chạy
        const swing = Math.sin(now * 0.015) * 0.8;
        leftLeg.rotation.x = swing; rightLeg.rotation.x = -swing;
        leftArm.rotation.x = -swing; rightArm.rotation.x = swing;
      } else {
        leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
        leftArm.rotation.x = 0; rightArm.rotation.x = 0;
      }

      // Nhảy (Space)
      playerState.velocityY += -30 * dt;
      player.position.y += playerState.velocityY * dt;
      if (player.position.y <= PLAYER_HEIGHT_OFFSET) { 
        player.position.y = PLAYER_HEIGHT_OFFSET; 
        playerState.velocityY = 0; 
        playerState.isJumping = false; 
      }

      // Giới hạn sân
      player.position.x = THREE.MathUtils.clamp(player.position.x, -48, 48);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -68, 68);

      // Dính bóng
      const dist = new THREE.Vector2(ball.position.x - player.position.x, ball.position.z - player.position.z).length();
      if (!ballPhysics.isControlled && dist < 1.5 && ball.position.y < 1) {
        ballPhysics.isControlled = true;
      }
      
      if (ballPhysics.isControlled) {
        const fwd = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
        // Bóng lăn dưới chân
        ball.position.lerp(player.position.clone().add(fwd.multiplyScalar(1)).setY(0.4), 0.3);
        
        // Sút (Space)
        if (keys['Space']) {
          ballPhysics.velocity.set(fwd.x * 40, 5, fwd.z * 40);
          ballPhysics.isControlled = false;
          keys['Space'] = false;
        }
      }
    }

    // AI TRỌNG TÀI CHẠY THEO BÓNG
    function updateReferee(dt, now) {
      // Trọng tài bám theo bóng nhưng giữ khoảng cách
      const targetX = ball.position.x * 0.9; 
      const targetZ = ball.position.z - 8; // Chạy phía sau bóng

      const dir = new THREE.Vector3(targetX - referee.position.x, 0, targetZ - referee.position.z);
      if (dir.length() > 2) {
        dir.normalize();
        referee.position.x += dir.x * 10 * dt; 
        referee.position.z += dir.z * 10 * dt;
        referee.rotation.y = THREE.MathUtils.lerp(referee.rotation.y, Math.atan2(dir.x, dir.z), 0.1);
        
        // Animation chạy trọng tài
        const swing = Math.sin(now * 0.02) * 0.8;
        refLeftLeg.rotation.x = swing; refRightLeg.rotation.x = -swing;
        refLeftArm.rotation.x = -swing; refRightArm.rotation.x = swing;
      }
    }

    function updateBall(dt) {
      if (!ballPhysics.isControlled) {
        ballPhysics.velocity.y += ballPhysics.gravity * dt;
        ball.position.x += ballPhysics.velocity.x * dt;
        ball.position.y += ballPhysics.velocity.y * dt;
        ball.position.z += ballPhysics.velocity.z * dt;
        
        if (ball.position.y < 0.4) {
          ball.position.y = 0.4;
          ballPhysics.velocity.y = -ballPhysics.velocity.y * 0.6;
          ballPhysics.velocity.x *= 0.98; ballPhysics.velocity.z *= 0.98;
        }
        
        // Va chạm biên
        if (Math.abs(ball.position.x) > 48) { ball.position.x = Math.sign(ball.position.x) * 48; ballPhysics.velocity.x *= -0.7; }
        if (Math.abs(ball.position.z) > 68) { ball.position.z = Math.sign(ball.position.z) * 68; ballPhysics.velocity.z *= -0.7; }
      }
    }

    function updateCamera() {
      // Camera lùi ra xa và nhìn từ trên xuống cao hơn
      const camOffset = new THREE.Vector3(0, 18, 22);
      camera.position.lerp(player.position.clone().add(camOffset), 0.1);
      camera.lookAt(player.position.x, player.position.y, player.position.z);
    }

    // ==========================================
    // 4. HỆ THỐNG THẺ PHẠT
    // ==========================================
    window.triggerFoul = function(type) {
      const cardEl = document.getElementById('card-warning');
      const typeEl = document.getElementById('card-type');
      const reasonEl = document.getElementById('card-reason');
      
      cardEl.className = ''; 
      
      if (type === 'yellow') {
        cardEl.classList.add('yellow-card');
        typeEl.textContent = "THẺ VÀNG ⚠️";
        reasonEl.textContent = "Lỗi: Phạm lỗi nguy hiểm!";
      } else {
        cardEl.classList.add('red-card');
        typeEl.textContent = "THẺ ĐỎ 🟥";
        reasonEl.textContent = "Lỗi: Truy cản trái phép (Nhận thẻ đỏ, rời sân!)";
        
        document.body.style.animation = "shake 0.5s";
        setTimeout(() => document.body.style.animation = "", 500);
      }
      
      cardEl.style.display = 'block';
      setTimeout(() => { cardEl.style.display = 'none'; }, 3000);
    };

  </script>
</body>
</html>
