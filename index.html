<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Lock Web - 3D Soccer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
    #ui { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; z-index: 10; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    #score { background: rgba(0,0,0,0.6); padding: 10px 30px; border-radius: 10px; border: 2px solid #00aaff; }
    #timer { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; border: 2px solid #ffaa00; }
    #hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; background: rgba(200,0,0,0.8); padding: 10px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; z-index: 10; border: 2px solid white; text-align: center; }
    #status { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); color: #ffeb3b; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 2px black; z-index: 10; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score">🔵 0 - 0 🔴</div>
    <div id="timer">90:00</div>
  </div>
  
  <div id="status">Trạng thái: Chưa giữ bóng</div>

  <div id="hint">
    WASD để di chuyển • SHIFT để chạy nhanh<br>
    J để SÚT (khi đang giữ bóng) • K để RÊ BÓNG (đẩy bóng dài)
  </div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Ánh sáng
    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(30, 50, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -60; sun.shadow.camera.right = 60; sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
    scene.add(sun);

    // Sân bóng
    const FIELD_W = 60; const FIELD_L = 100;
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W, FIELD_L), new THREE.MeshStandardMaterial({ color: 0x2d8a2d }));
    grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);

    function addLine(x, z, w, l) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(w, l), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2; line.position.set(x, 0.01, z); scene.add(line);
    }
    addLine(0, 0, FIELD_W, 0.3);
    const circle = new THREE.Mesh(new THREE.RingGeometry(9, 9.3, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
    circle.rotation.x = -Math.PI / 2; circle.position.y = 0.02; scene.add(circle);
    addLine(-FIELD_W/2, 0, 0.3, FIELD_L); addLine(FIELD_W/2, 0, 0.3, FIELD_L); addLine(0, -FIELD_L/2, FIELD_W, 0.3); addLine(0, FIELD_L/2, FIELD_W, 0.3);

    // Khung thành
    function createGoal(zPos) {
      const group = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const GOAL_W = 14; const GOAL_H = 5; const postR = 0.15;
      const postGeo = new THREE.CylinderGeometry(postR, postR, GOAL_H, 12);
      const leftPost = new THREE.Mesh(postGeo, postMat); leftPost.position.set(-GOAL_W/2, GOAL_H/2, 0); leftPost.castShadow = true; group.add(leftPost);
      const rightPost = new THREE.Mesh(postGeo, postMat); rightPost.position.set(GOAL_W/2, GOAL_H/2, 0); rightPost.castShadow = true; group.add(rightPost);
      const cross = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, GOAL_W, 12), postMat); cross.rotation.z = Math.PI / 2; cross.position.set(0, GOAL_H, 0); cross.castShadow = true; group.add(cross);
      const net = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_H), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15, side: THREE.DoubleSide })); net.position.set(0, GOAL_H/2, zPos > 0 ? -1 : 1); group.add(net);
      group.position.z = zPos; return group;
    }
    scene.add(createGoal(-FIELD_L/2)); scene.add(createGoal(FIELD_L/2));

    // Cầu thủ
    let leftLeg, rightLeg, leftArm, rightArm;
    function createPlayer(color) {
      const p = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
      const limbMat = new THREE.MeshStandardMaterial({ color: 0x1a5c1a });
      
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat); head.position.y = 2.4; head.castShadow = true; p.add(head);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), eyeMat); lEye.position.set(-0.2, 2.45, 0.41); p.add(lEye);
      const rEye = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), eyeMat); rEye.position.set(0.2, 2.45, 0.41); p.add(rEye);
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.5), bodyMat); body.position.y = 1.4; body.castShadow = true; p.add(body);
      
      const legGeo = new THREE.BoxGeometry(0.35, 1, 0.35);
      leftLeg = new THREE.Group(); const lL = new THREE.Mesh(legGeo, limbMat); lL.position.y = -0.5; lL.castShadow = true; leftLeg.add(lL); leftLeg.position.set(-0.25, 0.8, 0); p.add(leftLeg);
      rightLeg = new THREE.Group(); const rL = new THREE.Mesh(legGeo, limbMat); rL.position.y = -0.5; rL.castShadow = true; rightLeg.add(rL); rightLeg.position.set(0.25, 0.8, 0); p.add(rightLeg);
      
      const armGeo = new THREE.BoxGeometry(0.25, 1, 0.25);
      leftArm = new THREE.Group(); const lA = new THREE.Mesh(armGeo, bodyMat); lA.position.y = -0.5; lA.castShadow = true; leftArm.add(lA); leftArm.position.set(-0.575, 2, 0); p.add(leftArm);
      rightArm = new THREE.Group(); const rA = new THREE.Mesh(armGeo, bodyMat); rA.position.y = -0.5; rA.castShadow = true; rightArm.add(rA); rightArm.position.set(0.575, 2, 0); p.add(rightArm);
      return p;
    }
    const player = createPlayer(0x0066ff); player.position.set(0, 0, 20); scene.add(player);

    // Bóng
    const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.4, 24, 24), ballMat);
    ball.castShadow = true; ball.position.set(0, 0.4, 0); scene.add(ball);
    const ballCanvas = document.createElement('canvas'); ballCanvas.width = 256; ballCanvas.height = 256;
    const ctx = ballCanvas.getContext('2d'); ctx.fillStyle = 'white'; ctx.fillRect(0, 0, 256, 256); ctx.fillStyle = 'black';
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(Math.random()*256, Math.random()*256, 20, 0, Math.PI*2); ctx.fill(); }
    ballMat.map = new THREE.CanvasTexture(ballCanvas);

    // Vật lý
    const ballPhysics = { velocity: new THREE.Vector3(0, 0, 0), radius: 0.4, friction: 0.985, bounce: 0.6, gravity: -20, isControlled: false };

    // Điều khiển
    const keys = {};
    let kickTimer = 0; // Dùng cho animation sút/đẩy bóng
    let dribbleCooldown = 0; // Thời gian không cho hút bóng lại sau khi rê
    const statusEl = document.getElementById('status');

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') e.preventDefault(); 
      keys[e.code] = true;
      
      // SÚT (Phím J)
      if (e.code === 'KeyJ' && ballPhysics.isControlled && kickTimer <= 0) {
        const kickDir = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
        ballPhysics.velocity.x = kickDir.x * 35; ballPhysics.velocity.z = kickDir.z * 35; ballPhysics.velocity.y = 6;
        ballPhysics.isControlled = false; 
        kickTimer = 0.4; dribbleCooldown = 0.6; 
      }

      // RÊ BÓNG (Phím K)
      if (e.code === 'KeyK' && ballPhysics.isControlled && kickTimer <= 0) {
        const kickDir = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
        ballPhysics.velocity.x = kickDir.x * 18; // Đẩy bóng đi xa
        ballPhysics.velocity.z = kickDir.z * 18;
        ballPhysics.velocity.y = 0; // Lăn dưới đất
        ballPhysics.isControlled = false; 
        kickTimer = 0.2; // Animation đá nhẹ
        dribbleCooldown = 0.4; // Thời gian chờ để có thể đuổi theo bóng
      }
    });
    document.addEventListener('keyup', e => keys[e.code] = false);

    const playerSpeed = 12; const sprintMultiplier = 1.7;
    let walkTime = 0;
    const cameraOffset = new THREE.Vector3(0, 8, 12); const cameraTarget = new THREE.Vector3();
    let score = { blue: 0, red: 0 }; let timeLeft = 90; let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now(); const dt = Math.min((now - lastTime) / 1000, 0.05); lastTime = now;
      updatePlayer(dt); updateBall(dt); updateCamera(dt); updateTimer(dt); checkGoals();
      renderer.render(scene, camera);
    }

    function updatePlayer(dt) {
      const speed = keys['ShiftLeft'] ? playerSpeed * sprintMultiplier : playerSpeed;
      const dir = new THREE.Vector3();
      if (keys['KeyW']) dir.z -= 1; if (keys['KeyS']) dir.z += 1; if (keys['KeyA']) dir.x -= 1; if (keys['KeyD']) dir.x += 1;
      const isMoving = dir.length() > 0; let moveDistance = 0;

      if (isMoving) {
        dir.normalize(); moveDistance = speed * dt; player.position.x += dir.x * moveDistance; player.position.z += dir.z * moveDistance;
        const targetAngle = Math.atan2(dir.x, dir.z); player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetAngle, 0.2);
        walkTime += dt * speed * 1.5; const swing = Math.sin(walkTime) * 0.8;
        leftLeg.rotation.x = swing; rightLeg.rotation.x = -swing; leftArm.rotation.x = -swing; rightArm.rotation.x = swing;
      } else {
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.2); rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.2);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.2); rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.2);
      }
      
      const limitX = FIELD_W / 2 - 1; const limitZ = FIELD_L / 2 - 1;
      player.position.x = THREE.MathUtils.clamp(player.position.x, -limitX, limitX); player.position.z = THREE.MathUtils.clamp(player.position.z, -limitZ, limitZ);
      
      if (kickTimer > 0) {
        kickTimer -= dt; 
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -1.5, 0.5); rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 1.5, 0.5);
      }
      if (dribbleCooldown > 0) dribbleCooldown -= dt;
      
      // Bắt bóng
      const ballPos2D = new THREE.Vector2(ball.position.x, ball.position.z); const playerPos2D = new THREE.Vector2(player.position.x, player.position.z);
      const dist = ballPos2D.distanceTo(playerPos2D);
      
      // Chỉ bắt bóng khi không trong thời gian hồi
      if (!ballPhysics.isControlled && dist < 1.5 && ball.position.y <= ballPhysics.radius + 0.1 && dribbleCooldown <= 0) {
        ballPhysics.isControlled = true; ballPhysics.velocity.set(0, 0, 0); 
      }

      if (ballPhysics.isControlled) {
        statusEl.textContent = "Trạng thái: Đang giữ bóng (J: Sút | K: Rê bóng)"; statusEl.style.color = "#00ff00";
        
        // Cập nhật vị trí bóng mượt mà (dribble)
        const forwardDir = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
        const targetBallPos = player.position.clone().add(forwardDir.multiplyScalar(0.9)); targetBallPos.y = ballPhysics.radius; 
        
        // Lerp mượt mà hơn (0.3 thay vì 0.5 để bóng có độ trễ tự nhiên)
        ball.position.lerp(targetBallPos, 0.3);
        
        // Xoay bóng lăn theo hướng đi
        if (isMoving) {
          const axis = new THREE.Vector3(forwardDir.z, 0, -forwardDir.x).normalize();
          ball.rotateOnWorldAxis(axis, (moveDistance / ballPhysics.radius) * 1.5);
        }
      } else {
        statusEl.textContent = "Trạng thái: Chưa giữ bóng"; statusEl.style.color = "#ffeb3b";
      }
    }

    function updateBall(dt) {
      if (!ballPhysics.isControlled) {
        ballPhysics.velocity.y += ballPhysics.gravity * dt;
        ball.position.x += ballPhysics.velocity.x * dt; ball.position.y += ballPhysics.velocity.y * dt; ball.position.z += ballPhysics.velocity.z * dt;
        
        if (ball.position.y < ballPhysics.radius) {
          ball.position.y = ballPhysics.radius;
          if (Math.abs(ballPhysics.velocity.y) > 1) ballPhysics.velocity.y = -ballPhysics.velocity.y * ballPhysics.bounce; else ballPhysics.velocity.y = 0;
          // Ma sát
          ballPhysics.velocity.x *= ballPhysics.friction; ballPhysics.velocity.z *= ballPhysics.friction;
        }
        
        const limitX = FIELD_W / 2 - ballPhysics.radius; const limitZ = FIELD_L / 2 - ballPhysics.radius;
        if (Math.abs(ball.position.x) > limitX) { ball.position.x = Math.sign(ball.position.x) * limitX; ballPhysics.velocity.x *= -0.7; }
        if (Math.abs(ball.position.z) > limitZ && Math.abs(ball.position.x) > 7) { ball.position.z = Math.sign(ball.position.z) * limitZ; ballPhysics.velocity.z *= -0.7; }
        
        const speed = ballPhysics.velocity.length();
        if (speed > 0.1) { const axis = new THREE.Vector3(ballPhysics.velocity.z, 0, -ballPhysics.velocity.x).normalize(); ball.rotateOnWorldAxis(axis, speed * dt * 0.5); }
      }
    }

    function updateCamera(dt) {
      const targetPos = new THREE.Vector3(player.position.x + cameraOffset.x, player.position.y + cameraOffset.y, player.position.z + cameraOffset.z);
      camera.position.lerp(targetPos, 0.1); cameraTarget.set(player.position.x, player.position.y + 1, player.position.z); camera.lookAt(cameraTarget);
    }
    function updateTimer(dt) {
      timeLeft -= dt / 6; if (timeLeft < 0) timeLeft = 0;
      const min = Math.floor(timeLeft); const sec = Math.floor((timeLeft - min) * 60);
      document.getElementById('timer').textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }
    function checkGoals() {
      const GOAL_LINE = FIELD_L / 2;
      if (ball.position.z < -GOAL_LINE && Math.abs(ball.position.x) < 7) { score.blue++; resetBall(); updateScoreUI(); flashScreen(0x00aaff); }
      if (ball.position.z > GOAL_LINE && Math.abs(ball.position.x) < 7) { score.red++; resetBall(); updateScoreUI(); flashScreen(0xff3333); }
    }
    function resetBall() { 
      ball.position.set(0, ballPhysics.radius, 0); ballPhysics.velocity.set(0, 0, 0); 
      ballPhysics.isControlled = false; kickTimer = 0; dribbleCooldown = 0;
      player.position.set(0, 0, 20); player.rotation.y = 0; 
    }
    function updateScoreUI() { document.getElementById('score').textContent = `🔵 ${score.blue} - ${score.red} 🔴`; }
    function flashScreen(color) {
      const flash = document.createElement('div');
      flash.style.cssText = `position: fixed; inset: 0; background: #${color.toString(16).padStart(6, '0')}; opacity: 0.5; pointer-events: none; z-index: 100; transition: opacity 0.5s;`;
      document.body.appendChild(flash); setTimeout(() => flash.style.opacity = '0', 50); setTimeout(() => flash.remove(), 600);
    }
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    });
    camera.position.set(0, 8, 32); animate();
  </script>
</body>
</html>
